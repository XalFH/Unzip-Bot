<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ archive_name }} — Cloud Downloads</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(17, 24, 39, 0.82);
      --border: rgba(99, 102, 241, 0.28);
      --accent: #6366f1;
      --accent-2: #06b6d4;
      --emerald: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 60px;
    }

    .container { max-width: 840px; margin: 0 auto; }

    .hero {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .hero-left { flex: 1; min-width: 240px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 5px 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.22), rgba(6, 182, 212, 0.22));
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: 21px;
      font-weight: 700;
      word-break: break-word;
      margin-bottom: 10px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13.5px;
      color: var(--muted);
    }

    .meta-row span i { color: var(--accent-2); margin-right: 6px; }

    .zip-all-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--emerald), #059669);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
      transition: transform 0.15s, opacity 0.2s;
    }

    .zip-all-btn:hover { transform: translateY(-2px); opacity: 0.94; }

    .search-box { margin-bottom: 16px; position: relative; }

    .search-box input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus { border-color: var(--accent-2); }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .file-list { display: flex; flex-direction: column; gap: 11px; }

    .file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 14px 16px;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .file-card:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.55);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .file-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(6, 182, 212, 0.22));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-size: 18px;
      flex-shrink: 0;
    }

    .file-details { min-width: 0; }

    .file-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      transition: opacity 0.2s, transform 0.15s;
    }

    .dl-btn:hover { opacity: 0.92; transform: scale(1.03); }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      .zip-all-btn { width: 100%; justify-content: center; }
      .dl-btn span { display: none; }
      .dl-btn { padding: 10px 13px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="hero-left">
        <div class="badge"><i class="fa-solid fa-cloud-arrow-down"></i> Instant Cloud Downloader</div>
        <h1>{{ archive_name }}</h1>
        <div class="meta-row">
          <span><i class="fa-solid fa-folder-open"></i> {{ total_files }} Files</span>
          <span><i class="fa-solid fa-hard-drive"></i> {{ total_size }}</span>
          <span><i class="fa-solid fa-clock"></i> Valid for 2 Hours</span>
        </div>
      </div>
      <a class="zip-all-btn" href="{{ zip_all_url }}">
        <i class="fa-solid fa-file-zipper"></i> Download All (.ZIP)
      </a>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search extracted files by title..." onkeyup="filterFiles()" />
    </div>

    <div class="file-list" id="fileList">
      {% for file in files %}
      <div class="file-card" data-name="{{ file.name | lower }}">
        <div class="file-info">
          <div class="file-icon">
            <i class="fa-solid fa-file-lines"></i>
          </div>
          <div class="file-details">
            <div class="file-title" title="{{ file.rel_path }}">{{ file.name }}</div>
            <div class="file-sub">{{ file.size_str }} • .{{ file.ext }}</div>
          </div>
        </div>
        <a class="dl-btn" href="{{ file.dl_url }}" download>
          <i class="fa-solid fa-download"></i> <span>Download</span>
        </a>
      </div>
      {% endfor %}
    </div>

    <div class="footer">
      Powered by Ultra Unzip Cloud Bot ⚡
    </div>
  </div>

  <script>
    function filterFiles() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.file-card').forEach(card => {
        card.style.display = card.dataset.name.includes(q) ? 'flex' : 'none';
      });
    }
  </script>
</body>
</html>
