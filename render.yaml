services:
  - type: web
    name: telegram-unzip-cloud-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_DB
        sync: false
      - key: ADMIN
        sync: false
      - key: PORT
        value: "8080"
